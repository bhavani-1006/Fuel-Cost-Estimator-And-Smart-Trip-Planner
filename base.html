<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123b35"><meta name="description" content="Plan smarter road trips with TripWise. Estimate route distance, mileage, fuel price and estimated fuel cost."><link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/tripwise-192.svg') }}">
<title>{% block title %}TripWise — Travel smart{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}">TripWise <small>SMART TRIP PLANNER</small></a><nav><a href="{{ url_for('index') }}">Plan a trip</a><a href="{{ url_for('history') }}">Trip history</a><button id="installAppBtn" class="install-btn" type="button">⬇ Download App</button></nav></header>
<main>{% block content %}{% endblock %}</main><footer>TripWise · Plan thoughtfully, travel safely. Estimates are indicative and may differ from actual costs. <span class="store-note">App-store versions will be linked here after official publication.</span></footer>
<script src="{{ url_for('static', filename='app.js') }}" defer></script></body></html>
